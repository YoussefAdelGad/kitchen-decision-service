# Render's free instance sleeps after 15 idle minutes and takes 30-60 s to wake, which
# would fail the arena's 10-second limit on the first orders of a shift. This pings the
# health endpoint every 5 minutes so the instance never idles. Free on a public repo.
name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /kitchen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://kitchen-decision-service.onrender.com/kitchen)
          echo "health: HTTP $code"
          test "$code" = "200"
